[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycpython"
version = "0.1.0"
description = "A pure-Python reimplementation of CPython 3.14's compile() pipeline (tokenizer, PEG parser, symbol table, code generator, CFG optimizer, assembler)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "PSF-2.0"}

[tool.setuptools.packages.find]
include = ["pycpython*"]
